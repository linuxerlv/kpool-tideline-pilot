server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    types {
        text/html html;
        text/css css;
        text/javascript js mjs;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
