name: kpool Compose deployment
run-name: ${{ github.event_name == 'push' && 'kpool native deployment' || 'kpool rejected dispatch' }}

on:
  push:
    branches: [codex/tideline-provider-shape]

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify the isolated job coordinates
        run: |
          test "$GITHUB_REPOSITORY_ID" = 1466251904
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/codex/tideline-provider-shape

  build:
    name: build
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Test application
        run: node --test tests/game.test.mjs
      - name: Stop the provider-shape fixture before deployment
        run: exit 17

  deploy:
    name: deploy
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if GitHub starts this skipped job
        run: exit 19
