name: Protected native delivery after a Std app detach

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    if: >-
      github.repository == 'linuxerlv/kpool-tideline-pilot' &&
      github.ref == 'refs/heads/codex/tideline-hosted-offboarding' &&
      github.ref_protected && github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test game rules
        run: node --test tests/game.test.mjs
      - id: publish
        name: Publish exact game source
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          umask 077
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/tideline-ssh-native.XXXXXXXX")
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s\n' '{"auths":{"ghcr.io":{}}}' > "$DOCKER_CONFIG/config.json"
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset GHCR_TOKEN
          image='ghcr.io/linuxerlv/kpool-tideline-pilot'
          metadata="$DOCKER_CONFIG/build-metadata.json"
          docker buildx build --platform linux/amd64 --push --provenance=false --sbom=false \
            --tag "$image:ssh-native-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --label 'org.opencontainers.image.source=https://github.com/linuxerlv/kpool-tideline-pilot' \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" --metadata-file "$metadata" .
          digest=$(jq -er '."containerimage.digest"' "$metadata")
          grep -Eq '^sha256:[0-9a-f]{64}$' <<< "$digest"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'PUBLISHED_SSH_NATIVE ref=%s@%s commit=%s\n' "$image" "$digest" "$GITHUB_SHA"
  deliver:
    needs: publish
    if: >-
      github.repository == 'linuxerlv/kpool-tideline-pilot' &&
      github.ref == 'refs/heads/codex/tideline-hosted-offboarding' &&
      github.ref_protected && github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: tideline-hosted-offboarding
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Generate Runner-local disposable SSH identities
        run: |
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/tideline-keys" "$RUNNER_TEMP/tideline-public-keys"
          for role in query native; do
            ssh-keygen -q -t ed25519 -N '' -C "tideline-${GITHUB_RUN_ID}-${role}" -f "$RUNNER_TEMP/tideline-keys/$role"
            mv "$RUNNER_TEMP/tideline-keys/$role.pub" "$RUNNER_TEMP/tideline-public-keys/$role.pub"
          done
      - name: Publish only the public keys for exact-run enrollment
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: tideline-ssh-public-keys
          path: |
            ${{ runner.temp }}/tideline-public-keys/query.pub
            ${{ runner.temp }}/tideline-public-keys/native.pub
          if-no-files-found: error
          retention-days: 1
      - name: Admit the native revision through the restricted SSH gateway
        env:
          PILOT_HOST: ${{ vars.KPOOL_SSH_HOST }}
          PILOT_KNOWN_HOSTS: ${{ vars.KPOOL_SSH_KNOWN_HOSTS }}
          PILOT_QUERY_USER: ${{ vars.KPOOL_SSH_QUERY_USER }}
          PILOT_NATIVE_USER: ${{ vars.KPOOL_SSH_NATIVE_USER }}
          PILOT_TARGET: ${{ vars.KPOOL_SSH_TARGET_ID }}
          PILOT_ARTIFACT: ${{ needs.publish.outputs.digest }}
        run: python3 -B scripts/ssh_native_pilot.py
      - name: Remove Runner-local disposable identities
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/tideline-keys/query" "$RUNNER_TEMP/tideline-keys/native"
          test ! -e "$RUNNER_TEMP/tideline-keys/query"
          test ! -e "$RUNNER_TEMP/tideline-keys/native"
