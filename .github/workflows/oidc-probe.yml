name: A04 isolated Compose queue
run-name: ${{ inputs.correlation != '' && format('kpool:{0}', inputs.correlation) || 'A04 native queue' }}
on:
  workflow_dispatch:
    inputs:
      role:
        type: choice
        options: [C, H]
        default: C
      intent:
        type: string
      execution_sha:
        type: string
      correlation:
        type: string
      target_context:
        type: string
      authorization:
        type: string
permissions: {}
jobs:
  exercise:
    if: >-
      github.repository == 'linuxerlv/kpool-tideline-pilot' &&
      github.ref == 'refs/heads/codex/tideline-a04-queue-v2' &&
      github.ref_protected && github.workflow_sha == github.sha
    environment: tideline-hosted-a04-v2
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
      checks: read
      statuses: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Generate Runner-local disposable keys
        env:
          PILOT_ROLE: ${{ inputs.role }}
        run: |
          set -eu
          case "$PILOT_ROLE" in
            C) write_role=native ;;
            H) write_role=command ;;
            *) exit 1 ;;
          esac
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/a04-keys" "$RUNNER_TEMP/a04-public-keys"
          for role in query "$write_role"; do
            ssh-keygen -q -t ed25519 -N '' -C "a04-${GITHUB_RUN_ID}-${role}" -f "$RUNNER_TEMP/a04-keys/$role"
            mv -- "$RUNNER_TEMP/a04-keys/$role.pub" "$RUNNER_TEMP/a04-public-keys/$role.pub"
          done
      - name: Publish public keys for enrollment into the exact run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a04-public-keys-${{ inputs.role }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a04-public-keys/*.pub
          if-no-files-found: error
          retention-days: 1
      - name: Verify and offer the requested release through the pilot adapter
        env:
          PILOT_ROLE: ${{ inputs.role }}
          PILOT_SCOPE: ${{ vars.KPOOL_A04_SCOPE }}
          KPOOL_INTENT: ${{ inputs.intent }}
          KPOOL_EXECUTION_SHA: ${{ inputs.execution_sha }}
          KPOOL_CORRELATION: ${{ inputs.correlation }}
          KPOOL_TARGET_CONTEXT: ${{ inputs.target_context }}
          KPOOL_AUTHORIZATION: ${{ inputs.authorization }}
          KPOOL_DISPATCH_PUBLIC_KEY: ${{ vars.KPOOL_DISPATCH_PUBLIC_KEY }}
          KPOOL_CHECK_TOKEN: ${{ github.token }}
          KPOOL_SSH_HOST: ${{ vars.KPOOL_SSH_HOST }}
          KPOOL_SSH_PORT: ${{ vars.KPOOL_SSH_PORT }}
          KPOOL_SSH_KNOWN_HOSTS: ${{ vars.KPOOL_SSH_KNOWN_HOSTS }}
          KPOOL_SSH_QUERY_USER: ${{ vars.KPOOL_SSH_QUERY_USER }}
          KPOOL_SSH_NATIVE_USER: ${{ inputs.role == 'C' && vars.KPOOL_SSH_NATIVE_USER || '' }}
          KPOOL_SSH_COMMAND_USER: ${{ inputs.role == 'H' && vars.KPOOL_SSH_COMMAND_USER || '' }}
        run: python3 -B scripts/ssh_a04_pilot.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a04-${{ inputs.role }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a04-evidence.json
          if-no-files-found: error
          retention-days: 3
      - name: Remove Runner-local private keys
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/a04-keys/query" "$RUNNER_TEMP/a04-keys/native" "$RUNNER_TEMP/a04-keys/command"
