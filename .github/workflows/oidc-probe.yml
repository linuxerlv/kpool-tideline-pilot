name: GitHub OIDC identity probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'linuxerlv/kpool-tideline-pilot' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.default_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: tideline-oidc-probe
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned signature verification dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/tideline-oidc-venv"
          "$RUNNER_TEMP/tideline-oidc-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: --no-deps \
            'PyJWT==2.15.1' 'cryptography==50.0.2' 'cffi==2.1.1' 'pycparser==3.12'
      - name: Verify the GitHub-issued identity
        run: '"$RUNNER_TEMP/tideline-oidc-venv/bin/python" scripts/oidc_probe.py'
