name: Signed ordinary SSH deployment pilot
run-name: kpool:7a24f48d35a2da4be11f3a66c2ea09d4

on:
  workflow_dispatch:

permissions: {}

jobs:
  deliver:
    if: >-
      github.repository == 'linuxerlv/kpool-tideline-pilot' &&
      github.ref == 'refs/heads/codex/tideline-ssh-manual-pilot' &&
      github.ref_protected && github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: tideline-restricted-ssh-manual-pilot
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 8bf75f94e2fe206ad21509f0cbc6dfc50e90a387
          path: fixture-source
          persist-credentials: false
      - name: Test the exact archived game source
        run: |
          test "$(git -C fixture-source rev-parse HEAD)" = 8bf75f94e2fe206ad21509f0cbc6dfc50e90a387
          node --test fixture-source/tests/game.test.mjs
      - name: Verify signed approval and submit through restricted SSH
        env:
          PILOT_HOST: ${{ vars.KPOOL_SSH_HOST }}
          PILOT_KNOWN_HOSTS: ${{ vars.KPOOL_SSH_KNOWN_HOSTS }}
          PILOT_QUERY_USER: ${{ vars.KPOOL_SSH_QUERY_USER }}
          PILOT_COMMAND_USER: ${{ vars.KPOOL_SSH_COMMAND_USER }}
          PILOT_QUERY_KEY: ${{ secrets.KPOOL_SSH_QUERY_KEY }}
          PILOT_COMMAND_KEY: ${{ secrets.KPOOL_SSH_COMMAND_KEY }}
          KPOOL_INTENT: ${{ vars.KPOOL_INTENT }}
          KPOOL_EXECUTION_SHA: ${{ vars.KPOOL_EXECUTION_SHA }}
          KPOOL_CORRELATION: ${{ vars.KPOOL_CORRELATION }}
          KPOOL_TARGET_CONTEXT: ${{ vars.KPOOL_TARGET_CONTEXT }}
          KPOOL_AUTHORIZATION: ${{ vars.KPOOL_AUTHORIZATION }}
          KPOOL_DISPATCH_PUBLIC_KEY: ${{ vars.KPOOL_DISPATCH_PUBLIC_KEY }}
        run: python3 -B scripts/ssh_manual_pilot.py
