name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Game rules and container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Test game rules
        run: node --test tests/game.test.mjs
      - name: Build and smoke test the container
        shell: bash
        run: |
          image="tideline-game-ci:${GITHUB_SHA}"
          docker build --tag "$image" .
          printf 'Commit %s\n' "$GITHUB_SHA"
          docker image inspect --format 'Local image {{.Id}}' "$image"

          container=$(docker run --detach --publish 127.0.0.1::80 "$image")
          trap 'docker rm --force "$container" >/dev/null' EXIT
          address=$(docker port "$container" 80/tcp)
          [[ "$address" =~ ^127\.0\.0\.1:[0-9]+$ ]]
          base="http://${address}"

          health=$(curl --noproxy '*' --fail --silent --show-error --max-time 5 \
            --retry 10 --retry-connrefused --retry-delay 1 --retry-max-time 15 "$base/healthz")
          [[ "$health" == "ok" ]]

          page=$(curl --noproxy '*' --fail --silent --show-error --max-time 5 "$base/")
          grep -Fq '<script src="./game.mjs" type="module">' <<< "$page"

          for module in game.mjs game-engine.mjs; do
            mime=$(curl --noproxy '*' --fail --silent --show-error --max-time 5 \
              --output /dev/null --write-out '%{content_type}' "$base/$module")
            [[ "${mime%%;*}" == "text/javascript" ]]
            printf '%s served as %s\n' "$module" "$mime"
          done
