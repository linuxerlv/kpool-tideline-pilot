name: Tideline controlled diagnosis faults
run-name: 'kpool:${{ inputs.correlation }}'

on:
  workflow_dispatch:
    inputs:
      correlation:
        description: Correlation ID for this controlled diagnosis run
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test
    if: github.repository == 'linuxerlv/kpool-tideline-pilot' && github.ref == 'refs/heads/codex/tideline-diagnostic-pilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Prepare isolated tide regression
        run: |
          fixture="$(mktemp -d "$RUNNER_TEMP/tideline-test.XXXXXXXX")"
          mkdir "$fixture/tests"
          cp game-engine.mjs "$fixture/"
          cp tests/game.test.mjs "$fixture/tests/"
          node --input-type=module - "$fixture/game-engine.mjs" <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';

          const path = process.argv[2];
          const source = readFileSync(path, 'utf8');
          const expected = 'Math.floor(game.turn / 2)';
          if (source.split(expected).length !== 2) {
            throw new Error('Expected one two-turn tide calculation');
          }
          writeFileSync(path, source.replace(expected, 'Math.floor(game.turn / 3)'));
          JS
          printf 'TIDELINE_TEST_FIXTURE=%s\n' "$fixture" >> "$GITHUB_ENV"
      - name: Test application
        run: |
          node --test --test-name-pattern='^moving and waiting consume a turn and flip the tide every two turns$' \
            "$TIDELINE_TEST_FIXTURE/tests/game.test.mjs"

  distribute:
    name: distribute
    if: github.repository == 'linuxerlv/kpool-tideline-pilot' && github.ref == 'refs/heads/codex/tideline-diagnostic-pilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Build release package
        run: |
          fixture="$(mktemp -d "$RUNNER_TEMP/tideline-package.XXXXXXXX")"
          mkdir "$fixture/unpacked"
          test -f game-engine.mjs
          # Inject the release manifest omission while leaving the checked-out game intact.
          tar -czf "$fixture/tideline.tar.gz" index.html styles.css game.mjs
          tar -xzf "$fixture/tideline.tar.gz" -C "$fixture/unpacked"
          cd "$fixture/unpacked"
          node --input-type=module -e 'await import("./game-engine.mjs")'
