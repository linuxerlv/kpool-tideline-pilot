name: GitHub hosted cancellation smoke
run-name: 'kpool:${{ inputs.correlation }}'

on:
  workflow_dispatch:
    inputs:
      correlation:
        description: Unique tideline-cancel- identifier with 20 lowercase hexadecimal digits
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    if: >-
      ${{ !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'linuxerlv/kpool-tideline-pilot' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.default_branch == 'main' &&
      github.workflow_ref == 'linuxerlv/kpool-tideline-pilot/.github/workflows/cancellation-pilot.yml@refs/heads/main' &&
      github.workflow_sha == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Validate workflow scope
        env:
          CORRELATION: ${{ inputs.correlation }}
        run: |
          # GitHub expression comparisons ignore case. Check the scope exactly before checkout.
          [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]
          [[ "$GITHUB_REPOSITORY" == 'linuxerlv/kpool-tideline-pilot' ]]
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$(jq -er '.repository.default_branch' "$GITHUB_EVENT_PATH")" == 'main' ]]
          [[ "$GITHUB_WORKFLOW_REF" == 'linuxerlv/kpool-tideline-pilot/.github/workflows/cancellation-pilot.yml@refs/heads/main' ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$RUNNER_ENVIRONMENT" == 'github-hosted' && "$RUNNER_OS" == 'Linux' && "$RUNNER_ARCH" == 'X64' ]]
          [[ "$CORRELATION" =~ ^tideline-cancel-[a-f0-9]{20}$ ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build cancellation smoke package
        run: |
          tar --create --gzip --file "$RUNNER_TEMP/tideline-cancellation-smoke.tar.gz" \
            index.html styles.css game.mjs game-engine.mjs
      - name: Hold for manual cancellation
        run: exec sleep 300

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Report dry-run deployment boundary
        run: printf '%s\n' 'GitHub hosted cancellation smoke dry run reached its deployment boundary.'
